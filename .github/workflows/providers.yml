name: FragAI provider images

on:
  pull_request:
  push:
    branches: [main, fragai/provider-source-migration, fragai/encryption-source-migration]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: providers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: community/github-auth-provider/go.mod
          cache-dependency-path: |
            community/*/go.sum
            enterprise/*/go.sum
            encryption/*/go.sum
      - name: Run provider unit tests
        run: bash scripts/test.sh
      - name: Run encryption provider unit and mock integration tests
        run: bash scripts/test-encryption.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: providers
            image: fragai-providers
          - target: enterprise-providers
            image: fragai-enterprise-providers
          - target: encryption-bins
            image: fragai-encryption-bins
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Set image reference
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          version="sha-$SHA"
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          echo "reference=ghcr.io/${OWNER,,}/$IMAGE:$version" >> "$GITHUB_OUTPUT"
      - name: Authenticate release push
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.image.outputs.reference }}
          build-args: BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
